name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run compile

      - name: Read version from system.json
        id: meta
        run: |
          VERSION=$(node -p "require('./system.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch system.json URLs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node <<'EOF'
          const fs = require('fs')
          const repo = process.env.GITHUB_REPOSITORY
          const version = process.env.VERSION
          const tag = `v${version}`
          const system = JSON.parse(fs.readFileSync('system.json', 'utf8'))

          system.url = `https://github.com/${repo}`
          system.manifest = `https://github.com/${repo}/releases/latest/download/system.json`
          system.download = `https://github.com/${repo}/releases/download/${tag}/cortexprime.zip`

          fs.writeFileSync('system.json', `${JSON.stringify(system, null, 2)}\n`)
          EOF

      - name: Build zip
        run: |
          zip -r cortexprime.zip \
            system.json \
            cortexprime.js \
            assets \
            css \
            lang \
            lib \
            module \
            templates

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          artifacts: system.json,cortexprime.zip
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
